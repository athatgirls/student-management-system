# Isolated localhost-only stack; never uses production volumes or credentials.
services:
  mongo:
    image: mongo:7.0
    tmpfs: ["/data/db"]
  redis:
    image: redis:7.2-alpine
  backend:
    image: eclipse-temurin:11-jre
    working_dir: /app
    command: ["java", "-jar", "/app/app.jar"]
    volumes:
      - ../disciplinary_construction/target/disciplinary_construction-1.0-SNAPSHOT.jar:/app/app.jar:ro
    tmpfs: ["/app/uploads"]
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MONGODB_URI: mongodb://mongo:27017/report_v1_test
      REDIS_HOST: redis
      REDIS_PASSWORD: ""
      SERVER_PORT: 1010
      SERVER_CONTEXT_PATH: /SCSE@hbut
      JWT_SECRET: ${REPORT_TEST_SECRET:?Set REPORT_TEST_SECRET}
      APP_BOOTSTRAP_ADMIN_PASSWORD: ${REPORT_TEST_ADMIN_PASSWORD:?Set REPORT_TEST_ADMIN_PASSWORD}
      APP_BOOTSTRAP_ENABLED: "true"
      APP_DEMO_DATA_ENABLED: "false"
      APP_CORS_ALLOWED_ORIGINS: http://127.0.0.1:18086
      APP_UPLOAD_DIR: /app/uploads
    depends_on: [mongo, redis]
  frontend:
    image: nginx:1.28-alpine
    volumes:
      - ../index/dist:/usr/share/nginx/html:ro
      - ../index/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["127.0.0.1:18086:80"]
    depends_on: [backend]
