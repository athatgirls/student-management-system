# Isolated localhost-only stack; never uses production volumes or credentials.
services:
  mongo:
    image: mongo:7.0
    tmpfs: ["/data/db"]
  redis:
    image: redis:7.2-alpine
  rustfs:
    image: mis-rustfs:1.0.1
    volumes: ["rustfs_test_data:/data"]
    environment:
      RUSTFS_ACCESS_KEY: report-test-access-key
      RUSTFS_SECRET_KEY: report-test-secret-key
      RUSTFS_CONSOLE_ENABLE: "false"
    command: ["rustfs", "/data"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/health/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    image: eclipse-temurin:11-jre
    working_dir: /app
    command: ["java", "-jar", "/app/app.jar"]
    volumes:
      - ../disciplinary_construction/target/disciplinary_construction-1.0-SNAPSHOT.jar:/app/app.jar:ro
    tmpfs: ["/app/uploads"]
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MONGODB_URI: mongodb://mongo:27017/report_v1_test
      REDIS_HOST: redis
      REDIS_PASSWORD: ""
      SERVER_PORT: 1010
      SERVER_CONTEXT_PATH: /SCSE@hbut
      JWT_SECRET: ${REPORT_TEST_SECRET:?Set REPORT_TEST_SECRET}
      APP_BOOTSTRAP_ADMIN_PASSWORD: ${REPORT_TEST_ADMIN_PASSWORD:?Set REPORT_TEST_ADMIN_PASSWORD}
      APP_BOOTSTRAP_ENABLED: "true"
      APP_DEMO_DATA_ENABLED: "false"
      APP_CORS_ALLOWED_ORIGINS: http://127.0.0.1:18086
      APP_UPLOAD_DIR: /app/uploads
      RUSTFS_ENDPOINT: http://rustfs:9000
      RUSTFS_ACCESS_KEY: report-test-access-key
      RUSTFS_SECRET_KEY: report-test-secret-key
      RUSTFS_BUCKET: report-test-uploads
    depends_on:
      mongo:
        condition: service_started
      redis:
        condition: service_started
      rustfs:
        condition: service_healthy
  frontend:
    image: nginx:1.28-alpine
    volumes:
      - ../index/dist:/usr/share/nginx/html:ro
      - ../index/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["127.0.0.1:18086:80"]
    depends_on: [backend]
volumes:
  rustfs_test_data:
