name: mis-dev

services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 })"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    image: maven:3.9.9-eclipse-temurin-11
    working_dir: /app
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "1010:1010"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 1010
      SERVER_CONTEXT_PATH: /SCSE@hbut
      MONGODB_URI: mongodb://mongo:27017/disciplinary_construction
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-MIS_DEV_ONLY_CHANGE_THIS_64_CHAR_MINIMUM_SECRET_20260831_DEMO}
      APP_UPLOAD_DIR: /app/uploads
      APP_CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      APP_BOOTSTRAP_ENABLED: "true"
      APP_BOOTSTRAP_ADMIN_USERNAME: ${APP_BOOTSTRAP_ADMIN_USERNAME:-admin}
      APP_BOOTSTRAP_ADMIN_PASSWORD: ${APP_BOOTSTRAP_ADMIN_PASSWORD:-admin123}
      APP_DEMO_DATA_ENABLED: "true"
      APP_DEMO_STUDENT_PASSWORD: ${APP_DEMO_STUDENT_PASSWORD:-Student123!}
      KNIFE4J_ENABLE: "true"
    volumes:
      - ./disciplinary_construction:/app
      - maven_cache:/root/.m2
      - uploads_data:/app/uploads
    command: mvn spring-boot:run

  frontend:
    image: node:20.19.0-alpine
    working_dir: /app
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      VUE_APP_DEV_PROXY_TARGET: http://backend:1010
    volumes:
      - ./index:/app
      - frontend_node_modules:/app/node_modules
      - frontend_npm_cache:/root/.npm
    command:
      - sh
      - -ec
      - |
        lock_hash="$$(sha256sum package-lock.json | cut -d ' ' -f1)"
        if [ ! -x node_modules/.bin/vue-cli-service ] || [ "$$(cat node_modules/.package-lock.sha256 2>/dev/null || true)" != "$$lock_hash" ]; then
          npm ci --cache /root/.npm
          printf '%s\n' "$$lock_hash" > node_modules/.package-lock.sha256
        fi
        exec npm run serve

volumes:
  mongo_data:
  redis_data:
  uploads_data:
  maven_cache:
  frontend_node_modules:
  frontend_npm_cache:
