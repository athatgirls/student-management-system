spring:
  data:
    mongodb:
      uri: ${MONGODB_URI}
  redis:
    password: ${REDIS_PASSWORD}
  devtools:
    restart:
      enabled: false

logging:
  level:
    root: INFO
    org.example: INFO
    org.springframework.security: WARN
    org.springframework.data.mongodb: WARN
    com.mongodb.client: WARN

knife4j:
  enable: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  demo-data:
    enabled: ${APP_DEMO_DATA_ENABLED:false}
  bootstrap:
    admin:
      password: ${APP_BOOTSTRAP_ADMIN_PASSWORD}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}

jwt:
  secret: ${JWT_SECRET}
