version: "3.9"

services:
  mongo:
    image: mongo:6.0
    container_name: mis-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7.2-alpine
    container_name: mis-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mis-backend
    restart: unless-stopped
    depends_on:
      - mongo
      - redis
    ports:
      - "1010:1010"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 1010
      SERVER_CONTEXT_PATH: /SCSE@hbut
      MONGODB_URI: mongodb://mongo:27017/disciplinary_construction
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-MIS_DEV_ONLY_CHANGE_THIS_64_CHAR_MINIMUM_SECRET_20260424_DEPLOY}
      APP_UPLOAD_DIR: /app/uploads
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      KNIFE4J_ENABLE: "false"
    volumes:
      - uploads_data:/app/uploads

volumes:
  mongo_data:
  redis_data:
  uploads_data:
