name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    container: maven:3.9.9-eclipse-temurin-11
    env:
      MAVEN_OPTS: -Dmaven.repo.local=/root/.m2/repository
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: /root/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('disciplinary_construction/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Test and package backend
        working-directory: disciplinary_construction
        run: mvn -B package

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: index/package-lock.json
      - name: Install dependencies
        working-directory: index
        run: npm ci
      - name: Lint
        working-directory: index
        run: npm run lint
      - name: Build
        working-directory: index
        run: npm run build
      - name: Audit production dependencies
        working-directory: index
        run: npm audit --omit=dev
