name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
      - name: Test and package backend
        working-directory: disciplinary_construction
        run: mvn -B package

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: index/package-lock.json
      - name: Install dependencies
        working-directory: index
        run: npm ci
      - name: Lint
        working-directory: index
        run: npm run lint
      - name: Build
        working-directory: index
        run: npm run build
      - name: Test frontend handlers
        working-directory: index
        run: npm test
      - name: Audit production dependencies
        working-directory: index
        run: npm audit --omit=dev
